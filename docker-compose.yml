# RAGForge: one container, one volume. Uploads and the SQLite database live in the `ragforge-data` volume.
#
#   cp .env.example .env     # then set JWT_SECRET and ENCRYPTION_KEY (see the comments inside)
#   docker compose up -d --build
#   open http://localhost:8080
#
# Compose refuses to start until both secrets are set, so a default password can never reach production.

services:
  ragforge:
    build: .
    image: ragforge:latest
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (random, 32+ characters)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (64 hex characters)}
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-2}
      MCP_RATE_LIMIT: ${MCP_RATE_LIMIT:-60}
      # MAX_UPLOAD_BYTES is unset on purpose: uploads are unlimited unless you set it.
    volumes:
      - ragforge-data:/data
    restart: unless-stopped
    # The image's HEALTHCHECK probes /api/ready (database reachable, ingestion worker running).

volumes:
  ragforge-data:
