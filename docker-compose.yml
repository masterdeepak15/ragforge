version: "3.8"

services:
  ragforge:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - STORAGE_MODE=postgres
      - POSTGRES_URL=postgres://ragforge:${POSTGRES_PASSWORD:-ragforge-secret}@postgres:5432/ragforge
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-to-64-char-hex-key}
      - PUBLIC_URL=http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ragforge
      POSTGRES_USER: ragforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragforge-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragforge -d ragforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
